<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment verification</title><link rel="stylesheet" href="/styles.css"></head><body><main class="section" style="max-width:700px;text-align:center"><div class="logo-mark" style="margin:auto">TN</div><h1>Checking your payment…</h1><p id="status">Please wait while we verify your Paystack transaction securely.</p><a class="btn primary" href="/">Return to academy</a></main><script>
(async()=>{const ref=new URLSearchParams(location.search).get("reference");const s=document.querySelector("#status");if(!ref){s.textContent="No payment reference was supplied.";return}try{const r=await fetch("/.netlify/functions/paystack-verify?reference="+encodeURIComponent(ref));const d=await r.json();s.textContent=d.message||"Payment verification complete."}catch(e){s.textContent="We could not verify the payment right now. Please contact the academy if you were charged."}})();
</script></body></html>
